<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Name Generator</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>

    <div class="container">

    <h1>Wu-Tang Name Generator</h1>
    <div class="contain">
    <div class="box">
    <p>Pick an anime:</p>
    <select id="anime">
        <option value="naruto">Naruto</option>
        <option value="gintama">Gintama</option>
        <option value="dbz">Dragon Ball Z</option>
    </select>
    </div>
    <div class="box">
     <p>Pick a game:</p>
    <select id="game">
        <option value="re">Resident Evil</option>
        <option value="gow">God of War</option>
        <option value="er">Elden Ring</option>
    </select>
    </div>

    <div class="box">
    <p>Pick a color:</p>
    <select id="color">
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
    </select>
    </div>

    <div class="box">
     <p>Pick a sport:</p>
    <select id="sport">
        <option value="football">Football</option>
        <option value="golf">Golf</option>
        <option value="mma">Mixed Martial Arts</option>
    </select>
    </div>

    <div class="box">
     <p>Pick a food:</p>
    <select id="food">
        <option value="dumpling">Dumpling</option>
        <option value="noodle">Noodle</option>
        <option value="pizza">Pizza</option>
    </select>
    </div>
    </div>
    <br><br>

    <button id="press" type="button">Generate Name</button>

    <h2 id="generatedName"></h2>

    </div>

    <script type="text/javascript" src="/js/main.js"></script>

  </body>
</html>
